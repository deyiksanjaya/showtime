<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ShowTime">
  <title>ShowTime</title>
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180x180.png">
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --background-color: #000000;
      --container-bg: #1C1C1E;
      --text-primary: #FFFFFF;
      --text-secondary: #8E8E93;
      --accent-blue: #0A84FF;
      --border-color: #3A3A3C;
    }

    body {
      margin: 0;
      padding: 24px;
      background-color: var(--background-color);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }

    .container {
      max-width: 340px;
      width: 100%;
    }

    .card {
        background-color: var(--container-bg);
        border-radius: 18px;
        padding: 24px;
        display: none;
    }

    .card-header {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
    }
    
    .card-header h2 {
        font-size: 22px;
        font-weight: 600;
        margin: 0;
        color: var(--text-primary);
    }

    .card p {
      font-size: 16px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin: 0 0 24px 0;
    }

    .license-input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      text-align: center;
      background-color: #3A3A3C;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .license-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.3);
    }

    .activate-btn {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      font-weight: 600;
      color: white;
      background-color: var(--accent-blue);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 12px;
      transition: background-color 0.2s, transform 0.1s;
    }
    
    .activate-btn:active {
      background-color: #0060C0;
      transform: scale(0.98);
    }
    
    .recommendation-section {
      text-align: left;
    }
    
    .recommendation-section .card-header {
      margin-bottom: 16px;
    }
    
    .recommendation-section p {
        text-align: center;
        margin-top: -12px;
    }
    
    .instruction-step {
      display: flex;
      align-items: center;
      margin-top: 20px;
    }
    
    .instruction-step .icon {
        width: 28px;
        height: 28px;
        margin-right: 16px;
        flex-shrink: 0;
        filter: brightness(0) saturate(100%) invert(48%) sepia(82%) saturate(4925%) hue-rotate(193deg) brightness(108%) contrast(101%);
    }
    
    .instruction-step .instruction-text {
        font-size: 15px;
        color: var(--text-secondary);
        line-height: 1.4;
        margin: 0;
    }
    
    .instruction-step .instruction-text strong {
        color: var(--text-primary);
    }
    
    .footer-note {
        font-size: 13px;
        text-align: center;
        color: var(--accent-blue);
        margin-top: 24px;
        line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="card" id="activationCard">
      <div class="card-header">
        <h2>Activation</h2>
      </div>
      <p>Enter your license key to unlock ShowTime.</p>
      <input type="text" id="licenseKeyInput" class="license-input" placeholder="License key">
      <button id="activateBtn" class="activate-btn">Activate</button>
    </div>

    <div class="card recommendation-section" id="installCard">
      <div class="card-header">
        <h2>Install App</h2>
      </div>
      <p>Add ShowTime to your Home Screen first.</p>
      <div class="instruction-step">
        <img src="https://img.icons8.com/ios-glyphs/60/ffffff/share-rounded.png" alt="Share Icon" class="icon" onerror="this.style.display='none'">
        <div class="instruction-text">Tap the <strong>Share</strong> button in your browser.</div>
      </div>
       <div class="instruction-step">
        <img src="https://img.icons8.com/ios-glyphs/60/ffffff/plus-math.png" alt="Add to Home Screen Icon" class="icon" onerror="this.style.display='none'">
        <div class="instruction-text">Select <strong>Add to Home Screen</strong>.</div>
      </div>
      <div class="footer-note">
        After adding, close this browser and open the app from your Home Screen to activate.
      </div>
    </div>

  </div>

  <script>
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    
    if (isStandalone) {
        document.getElementById('activationCard').style.display = 'block';
    } else {
        document.getElementById('installCard').style.display = 'block';
    }

    const licenseInput = document.getElementById('licenseKeyInput');
    const activateBtn = document.getElementById('activateBtn');

    const attemptActivation = () => {
      const licenseKey = licenseInput.value.trim();
      if (licenseKey) {
        localStorage.setItem('showtime_license', licenseKey);
        localStorage.setItem('showtime_activated', "false");
        window.location.replace('app.html');
      } else {
        alert('Please enter a license key.');
      }
    };

    if(activateBtn) {
        activateBtn.addEventListener('click', attemptActivation);
    }

    if(licenseInput) {
        licenseInput.addEventListener('keyup', (event) => {
          if (event.key === 'Enter') {
            attemptActivation();
          }
        });
    }
  </script>
</body>
</html>
